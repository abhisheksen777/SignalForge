services:
  signalforge:
    build: .
    image: "signalforge:${SIGNALFORGE_IMAGE_TAG:-latest}"
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file: .env
    volumes:
      - signalforge-cache:/app/${CACHE_DIR:-.cache/signalforge}
    restart: unless-stopped

volumes:
  signalforge-cache:
